<!doctype html>

    <script>
      // Suppress transient WebSocket errors from Vite HMR in cloud iframe preview
      (function () {
        if (typeof Promise.try !== 'function') {
          Promise.try = function (fn) {
            var args = Array.prototype.slice.call(arguments, 1);
            return new Promise(function (resolve) {
              resolve(fn.apply(null, args));
            });
          };
        }

        // Mock WebSocket for Vite HMR to prevent "WebSocket closed without opened" in cloud iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          var MockWebSocket = function (url, protocols) {
            var isViteHmr = false;
            if (typeof protocols === 'string' && protocols === 'vite-hmr') isViteHmr = true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
            if (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('token=') !== -1)) isViteHmr = true;

            if (isViteHmr) {
              var target = new EventTarget();
              var mock = {
                url: url,
                protocol: 'vite-hmr',
                readyState: 0,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function () {},
                close: function () {
                  mock.readyState = 3;
                  target.dispatchEvent(new Event('close'));
                },
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };

              setTimeout(function () {
                mock.readyState = 1;
                var openEvt = new Event('open');
                if (typeof mock.onopen === 'function') mock.onopen(openEvt);
                target.dispatchEvent(openEvt);
              }, 10);

              return mock;
            }

            return new OrigWebSocket(url, protocols);
          };

          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;
          MockWebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket = MockWebSocket;
        }

        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function (a) {
            return (a && a.message) || String(a || '');
          }).join(' ');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('[vite] failed to connect to websocket') !== -1
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function (a) {
            return (a && a.message) || String(a || '');
          }).join(' ');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function (event) {
          var msg = (event && event.reason && (event.reason.message || String(event.reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (event) {
          var msg = (event && (event.message || (event.error && (event.error.message || String(event.error))))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });
      })();
    </script>

    <script>
      // Global fallback theme & share utilities
      window.toggleTheme = function() {
        var html = document.documentElement;
        var btn = document.getElementById('themeToggleBtn');
        if (html.classList.contains('dark')) {
          html.classList.remove('dark');
          if (btn) btn.textContent = '☀️';
          localStorage.setItem('yourpdfworld_theme_mode', 'light');
        } else {
          html.classList.add('dark');
          if (btn) btn.textContent = '🌙';
          localStorage.setItem('yourpdfworld_theme_mode', 'dark');
        }
      };

      window.shareApp = async function() {
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'yourPDFworld.com',
              text: 'Check out yourPDFworld.com - Your Complete PDF Solution.',
              url: window.location.href
            });
          } catch (err) {
            console.log('Share canceled');
          }
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href);
          alert('Link copied to clipboard!');
        }
      };
